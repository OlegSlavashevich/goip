[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
AUDIO_SOCKET_SERVICE=127.0.0.1:9092

[from-goip]
exten => 2000,1,NoOp(Incoming GSM call from ${CALLERID(all)})
 same => n,Answer()
 ; Ubuntu's Asterisk package does not ship the optional UUID() dialplan
 ; function. Build a valid v4-shaped UUID from the standard RAND() function.
 same => n,Set(CALL_UUID=${RAND(10000000,99999999)}-${RAND(1000,9999)}-4${RAND(100,999)}-8${RAND(100,999)}-${RAND(100000,999999)}${RAND(100000,999999)})
 same => n,AudioSocket(${CALL_UUID},${AUDIO_SOCKET_SERVICE})
 same => n,Hangup()

exten => _X!,1,Goto(2000,1)
exten => s,1,Goto(2000,1)
