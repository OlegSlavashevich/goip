[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
AUDIO_SOCKET_SERVICE=bridge:9092

[from-goip]
exten => 2000,1,NoOp(Incoming GSM call from ${CALLERID(all)})
 ; Ubuntu's Asterisk package does not ship the optional UUID() dialplan
 ; function. Build a valid v4-shaped UUID from the standard RAND() function.
 same => n,Set(CALL_UUID=${RAND(10000000,99999999)}-${RAND(1000,9999)}-4${RAND(100,999)}-8${RAND(100,999)}-${RAND(100000,999999)}${RAND(100000,999999)})
 same => n,Ringing()
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=15)
 same => n,Set(BRIDGE_READY=${CURL(http://bridge:9093/prepare)})
 same => n,GotoIf($["${BRIDGE_READY}"="ready"]?bridge-ready:bridge-unavailable)
 same => n(bridge-unavailable),NoOp(Bridge preload failed: ${BRIDGE_READY})
 same => n,Hangup(34)
 same => n(bridge-ready),Answer()
 same => n,AudioSocket(${CALL_UUID},${AUDIO_SOCKET_SERVICE})
 same => n,Hangup()

; Some GoIP firmwares send the SIM number or another numeric destination.
; Keeping this fallback makes the first diagnostic less firmware-dependent.
exten => _X!,1,Goto(2000,1)
exten => s,1,Goto(2000,1)
