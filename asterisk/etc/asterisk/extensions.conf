[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
AUDIO_SOCKET_SERVICE=bridge:9092

[from-goip]
exten => 2000,1,NoOp(Incoming GSM call from ${CALLERID(all)})
 same => n,Answer()
 same => n,Set(CALL_UUID=${UUID()})
 same => n,AudioSocket(${CALL_UUID},${AUDIO_SOCKET_SERVICE})
 same => n,Hangup()

; Some GoIP firmwares send the SIM number or another numeric destination.
; Keeping this fallback makes the first diagnostic less firmware-dependent.
exten => _X!,1,Goto(2000,1)
exten => s,1,Goto(2000,1)

