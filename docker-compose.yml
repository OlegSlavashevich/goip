services:
  bridge:
    build:
      context: ./bridge
    restart: unless-stopped
    environment:
      AUDIO_SOCKET_HOST: 0.0.0.0
      AUDIO_SOCKET_PORT: "9092"
      RECORDINGS_DIR: /app/recordings
      BRIDGE_MODE: "${BRIDGE_MODE:-record}"
      CALL_MAX_SECONDS: "${CALL_MAX_SECONDS:-10}"
      RECORD_CALLS: "${RECORD_CALLS:-true}"
      PROXY_WS_URL: "${PROXY_WS_URL:-}"
      PROXY_SHARED_TOKEN: "${PROXY_SHARED_TOKEN:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      BOT_PROFILE: "${BOT_PROFILE:-real-estate}"
      BOT_PAGE_URL: "${BOT_PAGE_URL:-https://kakdoma-sutochno.ru/assist/}"
      BOT_DATE_UTC_OFFSET: "${BOT_DATE_UTC_OFFSET:-+03:00}"
      BOT_VOICE_NAME: "${BOT_VOICE_NAME:-Erinome}"
      BOT_MAX_CALL_DURATION_MS: "${BOT_MAX_CALL_DURATION_MS:-1200000}"
      BOT_PRELOAD_CACHE_MS: "${BOT_PRELOAD_CACHE_MS:-300000}"
      ALLOW_CONFIRM_BOOKING: "${ALLOW_CONFIRM_BOOKING:-false}"
      READINESS_HOST: "0.0.0.0"
      READINESS_PORT: "9093"
      SYSTEM_INSTRUCTION: "${SYSTEM_INSTRUCTION:-}"
      INITIAL_TEXT: "${INITIAL_TEXT:-}"
      MAX_PENDING_AUDIO_BYTES: "${MAX_PENDING_AUDIO_BYTES:-1048576}"
      MAX_PLAYBACK_AUDIO_BYTES: "${MAX_PLAYBACK_AUDIO_BYTES:-1048576}"
      LATENCY_MONITORING: "${LATENCY_MONITORING:-true}"
      PROXY_PING_INTERVAL_MS: "${PROXY_PING_INTERVAL_MS:-5000}"
      PREPARE_AI_TIMEOUT_MS: "${PREPARE_AI_TIMEOUT_MS:-12000}"
      PREPARED_CALL_TTL_MS: "${PREPARED_CALL_TTL_MS:-30000}"
    volumes:
      - ./recordings:/app/recordings
    expose:
      - "9092"
      - "9093"
    networks:
      - voice

  asterisk:
    build:
      context: ./asterisk
    restart: unless-stopped
    environment:
      PUBLIC_IP: "${PUBLIC_IP:?Set PUBLIC_IP in .env}"
      GOIP_PUBLIC_IP: "${GOIP_PUBLIC_IP:?Set GOIP_PUBLIC_IP in .env}"
      SIP_USERNAME: "${SIP_USERNAME:?Set SIP_USERNAME in .env}"
      SIP_PASSWORD: "${SIP_PASSWORD:?Set SIP_PASSWORD in .env}"
      LOCAL_NETWORK: "${LOCAL_NETWORK:-172.16.0.0/12}"
      RECORD_CALLS: "${RECORD_CALLS:-true}"
    depends_on:
      - bridge
    ports:
      - "5060:5060/udp"
      - "10000-10099:10000-10099/udp"
    volumes:
      - ./recordings/full:/var/spool/asterisk/monitor/goip-ai-bridge
    networks:
      - voice

networks:
  voice:
    driver: bridge
